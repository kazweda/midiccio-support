name: Check Privacy Policy Version

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - PRIVACY_POLICY.md
      - PRIVACY_POLICY_EN.md
      - ci_scripts/check_privacy_policy_version.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              -- PRIVACY_POLICY.md PRIVACY_POLICY_EN.md ci_scripts/check_privacy_policy_version.py)
          else
            changed="push-triggered"
          fi
          if [ -n "$changed" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check version consistency
        if: steps.changes.outputs.relevant == 'true'
        run: python ci_scripts/check_privacy_policy_version.py
